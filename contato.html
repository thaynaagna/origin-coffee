<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Origin Coffee</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <nav>
    <div class="logo">☕ Origin Coffee</div>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
  </nav>

  <section class="page-header">
    <h1>Contato</h1>
    <p>Adoramos ouvir você ☕</p>
  </section>

  <main class="contato-page">

    <div class="contato-info">
      <div class="info-item">
        <span>📍</span>
        <p>Rua do Café, 123 - Belo Horizonte, MG</p>
      </div>
      <div class="info-item">
        <span>🕐</span>
        <p>Seg - Sex: 7h às 20h<br>Sáb - Dom: 8h às 18h</p>
      </div>
      <div class="info-item">
        <span>📱</span>
        <p>(31) 99999-9999</p>
      </div>
      <div class="info-item">
        <span>📧</span>
        <p>oi@OriginCoffee.com.br</p>
      </div>
    </div>

    <form class="contato-form">
      <h2>Envie uma mensagem</h2>
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Seu nome"/>

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Seu e-mail"/>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" rows="5" placeholder="Como podemos ajudar?"></textarea>

      <button type="submit" class="btn">Enviar mensagem</button>
    </form>

  </main>

  <footer>
    <p>© 2026 Origin Coffee · Feito com ☕ e carinho</p>
  </footer>

</body>
</html>
